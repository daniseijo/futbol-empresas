name: Sync league data

# Copies the changes from the futbolempresas.es API into the database (Turso) and
# tells the site to refresh its cache. Times in UTC: matches are Monday to Friday
# between 19:00 and 23:30 Madrid time.
on:
  schedule:
    - cron: "*/20 17-23 * * 1-5" # match nights: every 20 minutes
    - cron: "7 */3 * * *" # otherwise: every 3 hours
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Off until Turso is set up: create the repository variable SYNC_ENABLED=true
    # (Settings › Secrets and variables › Actions › Variables) to turn it on.
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Progressive: resumes the backfill where it stopped and stops after 15 minutes.
      - run: pnpm sync
        env:
          SYNC_BUDGET_SECONDS: 900
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
