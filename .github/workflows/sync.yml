name: Sync league data

# Copies the changes from the futbolempresas.es API into the database (Turso) and
# tells the site to refresh its cache. An external cron (cron-job.org, see
# scripts/cron-job.ts) starts it through workflow_dispatch once per match night,
# at 01:00 Madrid time from Tuesday to Friday; there is no GitHub schedule.
#
# The league's Cloudflare answers GitHub's IPs with a 403, so the job joins the
# owner's tailnet as an ephemeral `tag:ci` node and sends its traffic through an
# exit node at home (see "The sync's exit node" in the README). The Tailscale
# login uses GitHub's OIDC token: there is no long-lived Tailscale secret.
on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes before the sync pauses, up to 330 (longer runs advance the backfill faster)"
        type: number
        default: 15

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Off until Turso is set up: create the repository variable SYNC_ENABLED=true
    # (Settings › Secrets and variables › Actions › Variables) to turn it on.
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Room for the budget, installing and the unit running when it expires.
    # Expressions have no arithmetic, so long runs get GitHub's maximum.
    timeout-minutes: ${{ fromJSON(inputs.budget_minutes || 15) > 15 && 360 || 30 }}
    permissions:
      contents: read
      issues: write
      id-token: write # the OIDC token Tailscale's workload identity federation trades for a node key
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # After installing, so only the sync goes out through home. `quiet` keeps
      # routine output (peers, endpoints) out of this public log, and the ping
      # fails the run early, with a clear error, when the exit node is offline.
      - name: Route through the home exit node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --exit-node=${{ secrets.TS_EXIT_NODE }}
          ping: ${{ secrets.TS_EXIT_NODE }}
          log-mode: quiet
      # Progressive: resumes the backfill where it stopped and stops after the
      # budget: 15 minutes, unless a manual run asks for more.
      # A workflow_dispatch number input arrives as "15.0", and bash arithmetic
      # only takes integers, so the decimal part is dropped first.
      - run: SYNC_BUDGET_SECONDS=$((${BUDGET_MINUTES%.*} * 60)) pnpm sync
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes || 15 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # One open issue while the sync is failing: it notifies the owner, later
      # failures comment on it and the next success closes it. Running out of
      # budget is not a failure (pnpm sync pauses itself and exits 0).
      - name: Report the failure
        if: failure()
        run: |
          gh label create sync-failure --color d73a4a --description "The league data sync is failing" 2>/dev/null || true
          issue=$(gh issue list --label sync-failure --state open --json number --jq '.[0].number // empty')
          when=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again on $when (Madrid time): $RUN_URL"
          else
            gh issue create --label sync-failure --title "The sync is failing" \
              --body "The futbolempresas.es sync failed on $when (Madrid time): $RUN_URL. The site keeps showing the data from the last successful sync. This issue closes itself when a run succeeds again."
          fi
      - name: Close the failure report
        if: success()
        run: |
          for issue in $(gh issue list --label sync-failure --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Working again: $RUN_URL"
          done

  # Announces new or rescheduled matches (`pnpm notify`): the focus team's on the
  # channels whose secrets exist (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID,
  # SLACK_WEBHOOK_URL), and each subscribed team's on the Slack channels that
  # subscribed from the site (their webhooks are decrypted with
  # NOTIFY_ENCRYPTION_KEY). A job of its own, so a failure here never marks the
  # sync as failed.
  notify:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with notify.yml: two runs at once could send a call-up twice.
    concurrency:
      group: notify
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_ENCRYPTION_KEY: ${{ secrets.NOTIFY_ENCRYPTION_KEY }}
