name: Sincronizar datos de la liga

# Copia los cambios de la API de futbolempresas.es a la base de datos (Turso) y
# avisa a la web para que refresque su caché. Horas en UTC: los partidos son de
# lunes a viernes entre las 19:00 y las 23:30 de Madrid.
on:
  schedule:
    - cron: "*/20 17-23 * * 1-5" # noches de partido: cada 20 minutos
    - cron: "7 */3 * * *" # el resto: cada 3 horas
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Progresiva: sigue la carga donde se quedó y para a los 15 minutos.
      - run: pnpm sync
        env:
          SYNC_BUDGET_SECONDS: 900
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
