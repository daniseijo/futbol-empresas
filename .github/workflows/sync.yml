name: Sync league data

# Copies the changes from the futbolempresas.es API into the database (Turso) and
# tells the site to refresh its cache. On match nights (Monday to Friday, 20:30 to
# 01:50 Madrid time) an external cron starts it every 20 minutes through
# workflow_dispatch, because GitHub starts scheduled runs late or drops them on
# busy hours (see the README). The schedule here is the fallback, in UTC.
on:
  schedule:
    - cron: "7 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Minutes before the sync pauses, up to 330 (longer runs advance the backfill faster; scheduled runs wait meanwhile)"
        type: number
        default: 15

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Off until Turso is set up: create the repository variable SYNC_ENABLED=true
    # (Settings › Secrets and variables › Actions › Variables) to turn it on.
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Room for the budget, installing and the unit running when it expires.
    # Expressions have no arithmetic, so long runs get GitHub's maximum.
    timeout-minutes: ${{ (github.event.schedule == '0 7 * * 6,0' || fromJSON(inputs.budget_minutes || 15) > 15) && 360 || 30 }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Progressive: resumes the backfill where it stopped and stops after the
      # budget: 15 minutes, unless a manual run asks for more. The weekend run
      # gets 330, so a big backfill (the video archive) advances while there are
      # no matches to delay; with nothing pending it ends in a few minutes.
      - run: SYNC_BUDGET_SECONDS=$((BUDGET_MINUTES * 60)) pnpm sync
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes || (github.event.schedule == '0 7 * * 6,0' && 330) || 15 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # One open issue while the sync is failing: it notifies the owner, later
      # failures comment on it and the next success closes it. Running out of
      # budget is not a failure (pnpm sync pauses itself and exits 0).
      - name: Report the failure
        if: failure()
        run: |
          gh label create sync-failure --color d73a4a --description "The league data sync is failing" 2>/dev/null || true
          issue=$(gh issue list --label sync-failure --state open --json number --jq '.[0].number // empty')
          when=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again on $when (Madrid time): $RUN_URL"
          else
            gh issue create --label sync-failure --title "The sync is failing" \
              --body "The futbolempresas.es sync failed on $when (Madrid time): $RUN_URL. The site keeps showing the data from the last successful sync. This issue closes itself when a run succeeds again."
          fi
      - name: Close the failure report
        if: success()
        run: |
          for issue in $(gh issue list --label sync-failure --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Working again: $RUN_URL"
          done

  # Announces new or rescheduled matches (`pnpm notify`): the focus team's on the
  # channels whose secrets exist (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID,
  # SLACK_WEBHOOK_URL), and each subscribed team's on the Slack channels that
  # subscribed from the site (their webhooks are decrypted with
  # NOTIFY_ENCRYPTION_KEY). A job of its own, so a failure here never marks the
  # sync as failed.
  notify:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with notify.yml: two runs at once could send a call-up twice.
    concurrency:
      group: notify
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_ENCRYPTION_KEY: ${{ secrets.NOTIFY_ENCRYPTION_KEY }}
