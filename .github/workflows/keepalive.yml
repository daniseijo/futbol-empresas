name: Keep schedules alive

# GitHub disables scheduled workflows in public repositories after 60 days
# without commits, and the automation never commits (it writes to Turso). A
# disabled workflow cannot be dispatched either, so cron-job.org's calls would
# fail too. Enabling a workflow through the API resets that count, so once a
# month this re-enables the call-ups (on a schedule as a fallback) and itself.
# The sync has no schedule, so GitHub never disables it.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh workflow enable notify.yml
          gh workflow enable keepalive.yml
