name: CI

# Lint, types and unit tests on every push and pull request. Nothing here
# touches the database, so it needs no secrets.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # tsc needs the generated route types first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: pnpm test
